<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TrustScan — Dashboard</title>
  <meta name="robots" content="noindex">
  <style>body{font-family:Arial,Helvetica,sans-serif;padding:24px;color:#334}</style>
</head>
<body>
  <p>Loading TrustScan prototype — Dashboard...</p>
  <script>
    // Load the in-repo prototype HTML and set the initial view to the dashboard.
    fetch('TrustScan/prototype.html')
      .then(r => r.text())
      .then(html => {
        document.open(); document.write(html); document.close();
        try { location.hash = '#dashboard'; } catch (e) { /* ignore */ }
      })
      .catch(() => { document.body.innerHTML = '<p>Could not load the prototype. Open <a href="TrustScan/prototype.html">the prototype</a> instead.</p>'; });
  </script>
</body>
</html>
